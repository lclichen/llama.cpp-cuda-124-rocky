name: Build llama.cpp with CUDA

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no new release'
        required: false
        type: boolean
        default: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_hash: ${{ steps.check.outputs.release_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new llama.cpp release
        id: check
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | jq -r '.tag_name')
          RELEASE_HASH=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | jq -r '.target_commitish')
          
          echo "Latest llama.cpp release: $LATEST_RELEASE"
          echo "Release hash: $RELEASE_HASH"
          
          if git tag | grep -q "^${LATEST_RELEASE}$"; then
            echo "Release $LATEST_RELEASE already built"
            if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
              echo "Force build enabled, building anyway"
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "New release detected: $LATEST_RELEASE"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
          
          echo "release_tag=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          echo "release_hash=$RELEASE_HASH" >> $GITHUB_OUTPUT

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda_version: ['12.4.1']
        include:
          - cuda_version: '12.4.1'
            cuda_version_short: '12.4'
            # 修正点：恢复 cudnn-devel 标签，确保开发环境完整
            cuda_tag: '12.4.1-cudnn-devel-rockylinux8'
            # 仅保留主流及常用架构，移除了 CUDA 12.4 不支持的 100/120
            architectures: '75-virtual;80-virtual;86-virtual;89-virtual;90-virtual'
            arch_suffix: 'amd64'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          echo "=== Initial Disk Space ==="
          df -h
          echo "=== Removing unnecessary packages ==="
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri --fix-missing || true
          sudo apt-get autoremove -y && sudo apt-get clean || true
          echo "=== Removing large directories ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          echo "=== After Cleanup ==="
          df -h

      - name: Build llama.cpp with CUDA
        run: |
          docker pull nvidia/cuda:${{ matrix.cuda_tag }}
          
          docker run --rm -v $PWD:/workspace nvidia/cuda:${{ matrix.cuda_tag }} bash -c "
            set -e
            
            echo '=== Installing minimal dependencies (Rocky Linux 8) ==='
            dnf install -y epel-release
            dnf update -y
            dnf config-manager --set-enabled powertools
            # 安装 gcc-toolset-11 以获得完整的 C++17/CTAD 支持
            dnf install -y gcc-toolset-11-gcc gcc-toolset-11-gcc-c++ gcc-toolset-11-libstdc++-devel
            dnf install -y git cmake ninja-build make openssl-devel ca-certificates
            dnf clean all
            rm -rf /var/cache/dnf
            
            # 启用 GCC 11 环境（必须在同一个 shell session 中）
            source /opt/rh/gcc-toolset-11/enable
            
            echo "=== Using GCC version: $(gcc --version | head -1) ==="
            
            echo '=== Cloning llama.cpp ==='
            cd /workspace
            git clone --depth 1 --branch ${{ needs.check-release.outputs.release_tag }} https://github.com/ggml-org/llama.cpp.git || \
              (git clone https://github.com/ggml-org/llama.cpp.git && cd llama.cpp && git checkout ${{ needs.check-release.outputs.release_hash }})
            cd llama.cpp
            
            echo '=== Configuring build with Ninja ==='
            export LIBRARY_PATH="/usr/local/cuda/lib64/stubs${LIBRARY_PATH:+:$LIBRARY_PATH}"
            ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
            
            cmake -B build -S . \
              -G Ninja \
              -DGGML_CUDA=ON \
              -DCMAKE_CUDA_ARCHITECTURES='${{ matrix.architectures }}' \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DGGML_NATIVE=OFF \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DCMAKE_EXE_LINKER_FLAGS='-Wl,-rpath-link,/usr/local/cuda/lib64/stubs' \
              -DCMAKE_SHARED_LINKER_FLAGS='-Wl,-rpath-link,/usr/local/cuda/lib64/stubs'
            
            echo '=== Building with Ninja ==='
            cmake --build build --config Release -j\$(nproc)
            
            echo '=== Copying binaries ==='
            cd /workspace
            mkdir -p binaries/cuda-${{ matrix.cuda_version_short }}
            cp -r llama.cpp/build/bin/* binaries/cuda-${{ matrix.cuda_version_short }}/
            
            # Strip 二进制文件以减小体积 (排除 .so 动态库文件)
            find binaries/cuda-${{ matrix.cuda_version_short }}/ -type f -executable ! -name \"*.so*\" -exec strip {} \; 2>/dev/null || true

            echo '=== Creating version info ==='
            cat > binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt << EOF
          llama.cpp version: ${{ needs.check-release.outputs.release_tag }}
          CUDA version: ${{ matrix.cuda_version }}
          Base OS: Rocky Linux 8
          Architectures: ${{ matrix.architectures }}
          Build date: \$(date -u +%Y-%m-%d)
          Build hash: ${{ needs.check-release.outputs.release_hash }}
          EOF

            echo '=== Build complete ==='
            ls -lh binaries/cuda-${{ matrix.cuda_version_short }}/
            rm -rf llama.cpp
          "
          
          docker rmi nvidia/cuda:${{ matrix.cuda_tag }} || true
          sudo chown -R $(id -u):$(id -g) $PWD
          echo "=== Final disk usage ==="
          df -h

      - name: Create tarball
        run: |
          cd binaries
          tar -czf llama.cpp-${{ needs.check-release.outputs.release_tag }}-cuda-${{ matrix.cuda_version_short }}-${{ matrix.arch_suffix }}.tar.gz cuda-${{ matrix.cuda_version_short }}
          ls -lh *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-cuda-${{ matrix.cuda_version_short }}-${{ matrix.arch_suffix }}
          path: binaries/*.tar.gz
          retention-days: 1

  release:
    needs: [check-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create advancing release tag
        run: |
          set -euo pipefail
          TAG="${{ needs.check-release.outputs.release_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "llama.cpp ${TAG} (CUDA 12.4 Rocky8 build $(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-release.outputs.release_tag }}
          name: llama.cpp ${{ needs.check-release.outputs.release_tag }} with CUDA 12.4 (Rocky Linux 8)
          body: |
            # llama.cpp ${{ needs.check-release.outputs.release_tag }} with CUDA 12.4 Support
            
            Pre-built binaries of llama.cpp with CUDA support, optimized for x86_64 Linux environments.
            
            **Source:** https://github.com/ggml-org/llama.cpp/releases/tag/${{ needs.check-release.outputs.release_tag }}
            **Commit:** ${{ needs.check-release.outputs.release_hash }}
            
            ## Build Environment
            - **CUDA Version:** 12.4.1 (with cuDNN)
            - **Base OS:** Rocky Linux 8 (Ensures maximum compatibility with RHEL 8, AlmaLinux 8, CentOS Stream 8, etc.)
            - **GPU Compute Capabilities:** 7.5, 8.0, 8.6, 8.9, 9.0 (with `-virtual` PTX for forward compatibility)
            
            ## GPU compute capability reference
            - 7.5: Tesla T4, RTX 20xx series, Quadro RTX
            - 8.0: A100
            - 8.6: RTX 3000 series
            - 8.9: RTX 4000 series, L4, L40
            - 9.0: H100, H200, GH200

            ## Usage
            Download the tarball and extract:
            ```bash
            tar -xzf llama.cpp-${{ needs.check-release.outputs.release_tag }}-cuda-12.4-amd64.tar.gz
            cd cuda-12.4
            ./llama-cli --help
            ```
          files: release-assets/*
          draft: false
          prerelease: false
