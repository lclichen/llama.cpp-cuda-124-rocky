name: Build llama.cpp with CUDA

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no new release'
        required: false
        type: boolean
        default: false
      build_unsloth:
        description: 'Also build Unsloth iq1-narrow branch for Qwen3.8-UD'
        required: false
        type: boolean
        default: true

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_hash: ${{ steps.check.outputs.release_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new llama.cpp release
        id: check
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | jq -r '.tag_name')
          RELEASE_HASH=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | jq -r '.target_commitish')
          echo "Latest llama.cpp release: $LATEST_RELEASE"
          echo "Release hash: $RELEASE_HASH"

          if git tag | grep -q "^${LATEST_RELEASE}$"; then
            echo "Release $LATEST_RELEASE already built"
            if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "New release detected: $LATEST_RELEASE"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
          echo "release_tag=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          echo "release_hash=$RELEASE_HASH" >> $GITHUB_OUTPUT

  # ============================================================
  # Mainline build (原有逻辑完全保留)
  # ============================================================
  build-mainline:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda_version: ['12.4.1']
        include:
          - cuda_version: '12.4.1'
            cuda_version_short: '12.4'
            cuda_tag: '12.4.1-cudnn-devel-rockylinux8'
            architectures: '75-virtual;80-virtual;86-virtual;89-virtual;90-virtual'
            arch_suffix: 'amd64'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          df -h
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri --fix-missing || true
          sudo apt-get autoremove -y && sudo apt-get clean || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          df -h

      - name: Build llama.cpp Mainline with CUDA
        run: |
          docker pull nvidia/cuda:${{ matrix.cuda_tag }}
          docker run --rm -v $PWD:/workspace nvidia/cuda:${{ matrix.cuda_tag }} bash -c "
            set -e
            dnf install -y epel-release && dnf update -y
            dnf config-manager --set-enabled powertools
            dnf install -y gcc-toolset-11-gcc gcc-toolset-11-gcc-c++ gcc-toolset-11-libstdc++-devel
            dnf install -y git cmake ninja-build make openssl-devel ca-certificates
            dnf clean all && rm -rf /var/cache/dnf
            source /opt/rh/gcc-toolset-11/enable

            cd /workspace
            git clone --depth 1 --branch ${{ needs.check-release.outputs.release_tag }} https://github.com/ggml-org/llama.cpp.git || \
              (git clone https://github.com/ggml-org/llama.cpp.git && cd llama.cpp && git checkout ${{ needs.check-release.outputs.release_hash }})
            cd llama.cpp

            export LIBRARY_PATH=\"/usr/local/cuda/lib64/stubs\${LIBRARY_PATH:+:\$LIBRARY_PATH}\"
            ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1

            cmake -B build -S . -G Ninja \
              -DGGML_CUDA=ON \
              -DCMAKE_CUDA_ARCHITECTURES='${{ matrix.architectures }}' \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DGGML_NATIVE=OFF \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DCMAKE_EXE_LINKER_FLAGS='-Wl,-rpath-link,/usr/local/cuda/lib64/stubs' \
              -DCMAKE_SHARED_LINKER_FLAGS='-Wl,-rpath-link,/usr/local/cuda/lib64/stubs'

            cmake --build build --config Release -j\$(nproc)

            cd /workspace
            mkdir -p binaries/cuda-${{ matrix.cuda_version_short }}
            cp -r llama.cpp/build/bin/* binaries/cuda-${{ matrix.cuda_version_short }}/
            find binaries/cuda-${{ matrix.cuda_version_short }}/ -type f -executable ! -name '*.so*' -exec strip {} \; 2>/dev/null || true

            cat > binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt << EOF
          Variant: Mainline
          Version: ${{ needs.check-release.outputs.release_tag }}
          CUDA: ${{ matrix.cuda_version }}
          OS: Rocky Linux 8
          Archs: ${{ matrix.architectures }}
          Date: \$(date -u +%Y-%m-%d)
          Hash: ${{ needs.check-release.outputs.release_hash }}
          EOF
            ls -lh binaries/cuda-${{ matrix.cuda_version_short }}/
            rm -rf llama.cpp
          "
          docker rmi nvidia/cuda:${{ matrix.cuda_tag }} || true
          sudo chown -R \$(id -u):\$(id -g) \$PWD

      - name: Create tarball
        run: |
          cd binaries
          tar -czf llama.cpp-cuda-${{ matrix.cuda_version_short }}-${{ matrix.arch_suffix }}.tar.gz cuda-${{ matrix.cuda_version_short }}
          ls -lh *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-cuda-${{ matrix.cuda_version_short }}-${{ matrix.arch_suffix }}
          path: binaries/*.tar.gz
          retention-days: 7

  # ============================================================
  # Unsloth iq1-narrow build (新增，独立 job)
  # ============================================================
  build-unsloth:
    needs: check-release
    if: github.event.inputs.build_unsloth == 'true' || github.event.inputs.force_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda_version: ['12.4.1']
        include:
          - cuda_version: '12.4.1'
            cuda_version_short: '12.4'
            cuda_tag: '12.4.1-cudnn-devel-rockylinux8'
            architectures: '75-virtual;80-virtual;86-virtual;89-virtual;90-virtual'
            arch_suffix: 'amd64'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          df -h
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri --fix-missing || true
          sudo apt-get autoremove -y && sudo apt-get clean || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          df -h

      - name: Build Unsloth iq1-narrow with CUDA
        run: |
          docker pull nvidia/cuda:${{ matrix.cuda_tag }}
          docker run --rm -v $PWD:/workspace nvidia/cuda:${{ matrix.cuda_tag }} bash -c "
            set -e
            dnf install -y epel-release && dnf update -y
            dnf config-manager --set-enabled powertools
            dnf install -y gcc-toolset-11-gcc gcc-toolset-11-gcc-c++ gcc-toolset-11-libstdc++-devel
            dnf install -y git cmake ninja-build make openssl-devel ca-certificates
            dnf clean all && rm -rf /var/cache/dnf
            source /opt/rh/gcc-toolset-11/enable

            cd /workspace
            echo '=== Cloning Unsloth iq1-narrow ==='
            git clone --depth 1 --branch iq1-narrow https://github.com/unslothai/llama.cpp.git llama.cpp
            cd llama.cpp
            UNSLOTH_COMMIT=\$(git rev-parse HEAD)

            export LIBRARY_PATH=\"/usr/local/cuda/lib64/stubs\${LIBRARY_PATH:+:\$LIBRARY_PATH}\"
            ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1

            cmake -B build -S . -G Ninja \
              -DGGML_CUDA=ON \
              -DCMAKE_CUDA_ARCHITECTURES='${{ matrix.architectures }}' \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DGGML_NATIVE=OFF \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DCMAKE_EXE_LINKER_FLAGS='-Wl,-rpath-link,/usr/local/cuda/lib64/stubs' \
              -DCMAKE_SHARED_LINKER_FLAGS='-Wl,-rpath-link,/usr/local/cuda/lib64/stubs'

            cmake --build build --config Release -j\$(nproc)

            cd /workspace
            mkdir -p binaries/cuda-unsloth-${{ matrix.cuda_version_short }}
            cp -r llama.cpp/build/bin/* binaries/cuda-unsloth-${{ matrix.cuda_version_short }}/
            find binaries/cuda-unsloth-${{ matrix.cuda_version_short }}/ -type f -executable ! -name '*.so*' -exec strip {} \; 2>/dev/null || true

            cat > binaries/cuda-unsloth-${{ matrix.cuda_version_short }}/VERSION.txt << EOF
          Variant: Unsloth iq1-narrow (Qwen3.8-UD)
          Commit: \${UNSLOTH_COMMIT}
          CUDA: ${{ matrix.cuda_version }}
          OS: Rocky Linux 8
          Archs: ${{ matrix.architectures }}
          Date: \$(date -u +%Y-%m-%d)
          EOF
            ls -lh binaries/cuda-unsloth-${{ matrix.cuda_version_short }}/
            rm -rf llama.cpp
          "
          docker rmi nvidia/cuda:${{ matrix.cuda_tag }} || true
          sudo chown -R \$(id -u):\$(id -g) \$PWD

      - name: Create tarball
        run: |
          cd binaries
          tar -czf llama.cpp-cuda-unsloth-${{ matrix.cuda_version_short }}-${{ matrix.arch_suffix }}.tar.gz cuda-unsloth-${{ matrix.cuda_version_short }}
          ls -lh *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-cuda-unsloth-${{ matrix.cuda_version_short }}-${{ matrix.arch_suffix }}
          path: binaries/*.tar.gz
          retention-days: 7

  # ============================================================
  # Release (合并两个 job 的产物)
  # ============================================================
  release:
    needs: [check-release, build-mainline, build-unsloth]
    if: always() && (needs.build-mainline.result == 'success' || needs.build-unsloth.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name '*.tar.gz' -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create advancing release tag
        if: needs.build-mainline.result == 'success'
        run: |
          set -euo pipefail
          TAG="${{ needs.check-release.outputs.release_tag }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "llama.cpp ${TAG} (CUDA 12.4 Rocky8 build $(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Create Release
        if: needs.build-mainline.result == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-release.outputs.release_tag }}
          name: llama.cpp ${{ needs.check-release.outputs.release_tag }} with CUDA 12.4 (Rocky Linux 8)
          body: |
            # llama.cpp ${{ needs.check-release.outputs.release_tag }} with CUDA 12.4

            ## Variants
            | File | Description |
            |------|-------------|
            | `*-cuda-12.4-amd64.tar.gz` | Official mainline release |
            | `*-cuda-unsloth-12.4-amd64.tar.gz` | Unsloth `iq1-narrow` for **Qwen3.8-UD** |

            ## Build Info
            - CUDA 12.4.1 + cuDNN, Rocky Linux 8
            - Architectures: 7.5, 8.0, 8.6, 8.9, 9.0
          files: release-assets/*
          draft: false
          prerelease: false
